name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# Required by the Pages deployment job.
permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref group: a PR branch's runs must never occupy main's slot. A single static
# group bit the NBA viewer on 2026-08-13 — GitHub keeps one running + one pending run
# per group and each new arrival CANCELS the previous pending one, so while a busy PR
# was pushing, main's CI (and its deploy) kept getting cancelled before it could start.
# The only thing that must serialize repo-wide is the Pages deploy, which has its own
# job-level `pages` group below (shared with refresh-data's deploy job).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Coverage thresholds are set to 100% in vite.config.js, so this fails
      # the build if any line ships untested.
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize Pages deploys across workflows (CI + refresh-data), never mid-cancel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Netlify deploys via its own GitHub integration (it builds the site on every push
  # using netlify.toml), so there is no Netlify job here — a CI-driven deploy would be a
  # redundant second path to the same site, and it would miss the refresh bot's commits
  # entirely: those are authored by GITHUB_TOKEN, which cannot trigger this workflow.

  # The refresh workflow runs the fetch scripts without installing anything, so
  # they must not import from node_modules. This guards that property.
  scripts-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail if a fetch script imports a dependency
        run: |
          if grep -REn "^\s*import .* from ['\"][^.n]" scripts/ \
             | grep -v "from ['\"]node:"; then
            echo "::error::scripts/ may only import Node built-ins and local files"
            exit 1
          fi
          echo "scripts/ uses Node built-ins only"

  # Check the DEPLOYED site, which nothing else in this repo ever does: the build,
  # the tests and the jobs above all work on local files, so a dead host, a URL
  # pointing at a sibling's site, or a calendar feed that disagrees with the
  # committed schedule are invisible to the entire gate. See
  # sports-viewer-meta/docs/LINEAGES.md section 5.
  #
  # Never a required check: it depends on GitHub Pages and Netlify having finished
  # publishing, and Netlify builds from its own git trigger on its own schedule, so
  # a red run here can mean "not deployed yet" rather than "broken". It reports.
  smoke:
    name: Smoke-test production
    needs: pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Netlify's build is triggered by the same push but runs independently of
      # this workflow, so give it a moment before asking it for the feed.
      - name: Wait for the hosts to publish
        run: sleep 60
      # No `npm ci`: the script uses Node built-ins only.
      - name: Check the deployed URLs and the calendar feed
        shell: bash
        run: node scripts/smoke-prod.mjs
