name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# Required by the Pages deployment job.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Coverage thresholds are set to 100% in vite.config.js, so this fails
      # the build if any line ships untested.
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Netlify deploys via its own GitHub integration (it builds the site on every push
  # using netlify.toml), so there is no Netlify job here — a CI-driven deploy would be a
  # redundant second path to the same site, and it would miss the refresh bot's commits
  # entirely: those are authored by GITHUB_TOKEN, which cannot trigger this workflow.

  # The refresh workflow runs the fetch scripts without installing anything, so
  # they must not import from node_modules. This guards that property.
  scripts-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail if a fetch script imports a dependency
        run: |
          if grep -REn "^\s*import .* from ['\"][^.n]" scripts/ \
             | grep -v "from ['\"]node:"; then
            echo "::error::scripts/ may only import Node built-ins and local files"
            exit 1
          fi
          echo "scripts/ uses Node built-ins only"
