name: Refresh data

# Twice daily during the season. The fetch scripts use Node built-ins only, so this job
# needs no npm ci to produce the new data — the install happens later, and only to run
# the tests against it. On any change it tests, commits to main, and redeploys the site —
# all in this one job; the test run is the gate, so a bad refresh fails here not on the
# live site.
on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data to main
  pages: write # deploy the rebuilt site
  id-token: write # OIDC for actions/deploy-pages

# The fetch/test phase needs no repo-wide lock — only the Pages deploy must serialize
# with CI's, and that lives as a job-level `pages` group on both deploy jobs. A static
# workflow-level `pages` group here used to occupy the shared slot for the whole
# fetch+gate run and helped cancel main's queued CI on 2026-08-13.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Fetch fixtures, stats and history
        run: npm run fetch:all

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data public/logos; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate: standings and stats are derived from the committed results, so a bad
      # refresh fails a test here rather than shipping a wrong-looking table. Run the SAME gate as
      # CI (the 100% coverage gate), because this push triggers no CI of its own —
      # a weaker gate here once let refreshed data dry up a covered branch and break
      # the next human push (WNBA raceScenarios, 2026-08-10).
      - name: Test against the refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run test:coverage

      # Commit straight to main (the test above is the gate). This push is authored by
      # GITHUB_TOKEN, so it does NOT trigger the CI deploy — this workflow deploys itself
      # in the job below instead.
      - name: Commit the refreshed data to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/data public/logos
          git commit -m "Refresh fixtures, stats and historical tables"
          # main can move between this job's checkout and its push: a human push, or a
          # sibling workflow landing its own commit. A bare `git push` then dies with
          # "! [rejected] main -> main (fetch first)" and the whole refresh is thrown
          # away until the next scheduled run. That happened to the WNBA viewer on
          # 2026-08-29, when a hand push landed one second before this step. So rebase
          # our single data commit onto whatever arrived and try again. Rebasing is safe
          # here because the commit touches only generated paths that nothing else
          # writes; a real conflict is not resolvable unattended, so we let it fail
          # loudly instead of forcing.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the refreshed data after 3 rebase attempts"
          exit 1

      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Upload the Pages artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes the artifact the refresh job built — only when there was a change.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Serialize Pages deploys across workflows (CI + refresh-data), never mid-cancel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
